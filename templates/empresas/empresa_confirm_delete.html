{% extends "base.html" %}
{% block title %}Excluir empresa{% endblock %}
{% block content %}
<h1 class="h4">Excluir "{{ empresa }}"?</h1>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Confirmar exclusão</button>
    <a href="{% url 'empresas:lista' %}" class="btn btn-outline-secondary">Cancelar</a>
</form>
{% endblock %}
