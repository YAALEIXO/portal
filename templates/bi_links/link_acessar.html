{% extends "base.html" %}
{% block title %}{{ link.nome }}{% endblock %}
{% block content %}
<h1 class="h5 mb-2">{{ link.nome }}</h1>
<div class="border rounded shadow-sm overflow-hidden" style="height: calc(100vh - 160px);">
    <iframe src="{{ link.url }}" title="{{ link.nome }}" style="width: 100%; height: 100%; border: 0;"></iframe>
</div>
<p class="text-muted small mt-2">
    Se o conteúdo não aparecer acima, entre em contato com o administrador.
</p>
{% endblock %}
